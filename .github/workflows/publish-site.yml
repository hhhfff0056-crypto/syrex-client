name: Build and publish Syrex site
on:
  push:
    branches: [main]
    paths:
      - '.source/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .source/package-lock.json
      - name: Build website
        working-directory: .source
        env:
          VITE_SUPABASE_URL: https://schhzjmsgdjicoiadoqx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ege-vbqEyqsq6HRn7DXtBQ_MQ8Op1UH
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build
      - name: Update published files
        run: |
          cp -a .source/dist/. .
          echo syrex.us.mw > CNAME
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets CNAME .nojekyll
          git add -A -- '*.svg' '*.png' '*.webp' '*.ico' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Syrex website build'
            git push
          fi
