name: Publish exact-name Syrex Free JAR on Pages
on:
  push:
    paths:
      - .github/workflows/publish-free-pages.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Syrex Free release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: hhhfff0056-crypto/syrex-client
        run: |
          set -euo pipefail
          gh release download free-1.21.11-20261117 --pattern 'syrex.1.21.11.jar' --dir /tmp
          echo "3d3a7a085c9bc73d38e5b86d12721cf9b9f68500754d89e609508c83ed27e3f4  /tmp/syrex.1.21.11.jar" | sha256sum --check -
          mv /tmp/syrex.1.21.11.jar 'syrex 1.21.11.jar'
      - name: Commit exact file name for website downloads
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'syrex 1.21.11.jar'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Syrex Free 1.21.11 JAR'
            git push origin HEAD:main
          fi
